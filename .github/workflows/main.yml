name: BAP Scraper

on:
  schedule:
    - cron: "0 8 10 * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      # Evita warning/depreciação de actions em Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check Chrome version
        run: google-chrome --version

      - name: Validate required secrets
        env:
          BAP_USERNAME: ${{ secrets.BAP_USERNAME }}
          BAP_PASSWORD: ${{ secrets.BAP_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          test -n "$BAP_USERNAME" || (echo "Secret BAP_USERNAME ausente"; exit 1)
          test -n "$BAP_PASSWORD" || (echo "Secret BAP_PASSWORD ausente"; exit 1)
          test -n "$GOOGLE_CREDENTIALS_JSON" || (echo "Secret GOOGLE_CREDENTIALS_JSON ausente"; exit 1)

      - name: Run scraper
        env:
          BAP_USERNAME: ${{ secrets.BAP_USERNAME }}
          BAP_PASSWORD: ${{ secrets.BAP_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          HEADLESS_MODE: "true"
        run: python scraper.py
